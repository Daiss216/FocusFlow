<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FocusFlow - Offline AI Notes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
      :root {
        --bg: #0f1115;
        --card: #1a1d24;
        --accent: #4ade80;
        --text: #e5e7eb;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          Segoe UI,
          Roboto,
          sans-serif;
        display: flex;
        justify-content: center;
        padding: 32px 16px;
      }
      .wrap {
        width: 100%;
        max-width: 720px;
        flex: 1;
      }
      h1 {
        font-size: 1.4rem;
        margin-bottom: 4px;
      }
      .sub {
        color: #9ca3af;
        font-size: 0.9rem;
        margin-bottom: 20px;
      }
      .card {
        background: var(--card);
        border: 1px solid #262a33;
        border-radius: 12px;
        padding: 18px;
        margin-bottom: 16px;
      }
      button {
        background: var(--accent);
        color: #052e16;
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        font-weight: 600;
        cursor: pointer;
        margin-right: 8px;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button.ghost {
        background: #262a33;
        color: var(--text);
      }
      select,
      input[type="file"] {
        background: #262a33;
        color: var(--text);
        border: 1px solid #333947;
        border-radius: 8px;
        padding: 8px;
        margin: 6px 0;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 0.9rem;
        background: #10131a;
        padding: 12px;
        border-radius: 8px;
        margin-top: 10px;
      }
      h3 {
        font-size: 0.85rem;
        color: var(--accent);
        margin-top: 14px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .pill {
        display: inline-block;
        background: #262a33;
        border-radius: 99px;
        padding: 4px 10px;
        font-size: 0.8rem;
        margin: 2px;
      }
      #status {
        color: #fbbf24;
        font-size: 0.85rem;
        margin-top: 8px;
      }

      footer { 
        margin-top:32px; 
        padding:20px 0 28px; 
        border-top:1px solid #262a33;
        color:#6b7280; 
        font-size:.8rem; 
        text-align:center; 
      }

      footer a { 
        color:#6b7280; 
        text-decoration:none; 
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

    </style>
    <base target="_blank" />
  </head>
  <br>
  <div>
    <div class="wrap">
      <h1>⏳ FocusFlow</h1>
      <div class="sub">
        Private, offline meeting notes — everything runs on your PC. Nothing is
        uploaded to the cloud.
      </div>

      <div class="card">
        <br class="row">
          <button id="recBtn">🎙️ Record</button>
          <button id="stopBtn" class="ghost" disabled>⏹ Stop & Process</button>
          </br>
          <span style="color: #6b7280; font-size: 0.85rem">or</span>
          </br>
          <input type="file" id="fileInput" accept="audio/*" />
          <select id="model">
            <option value="tiny">tiny (fastest)</option>
            <option value="base">base</option>
            <option value="small">small (most accurate)</option>
          </select>
        </div>
        <div id="status"></div>
      </div>
      
      <div class="card" id="outCard" style="display: none">
        <h3>Transcript</h3>
        <pre id="transcript"></pre>
        <h3>Summary</h3>
        <pre id="summary"></pre>
        <h3>Keywords</h3>
        <div id="keywords"></div>
      </div>

      <footer>
        © 2026 | built for Snapdragon-powered HP PCs |
        <a href="https://github.com/Daiss216/FocusFlow">GitHub</a>
      </footer>
    </div>

    <script>
      const recBtn = document.getElementById("recBtn");
      const stopBtn = document.getElementById("stopBtn");
      const statusEl = document.getElementById("status");
      let recorder,
        chunks = [];

      recBtn.onclick = async () => {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: true,
        });
        recorder = new MediaRecorder(stream);
        chunks = [];
        recorder.ondataavailable = (e) => chunks.push(e.data);
        recorder.onstop = () =>
          process(
            new Blob(chunks, { type: recorder.mimeType }),
            "recording.webm",
          );
        recorder.start();
        recBtn.disabled = true;
        stopBtn.disabled = false;
        statusEl.textContent =
          "🔴 Recording... speak, then press Stop & Process.";
      };

      stopBtn.onclick = () => {
        recorder.stop();
        recBtn.disabled = false;
        stopBtn.disabled = true;
        recorder.stream.getTracks().forEach((t) => t.stop());
      };

      document.getElementById("fileInput").onchange = (e) => {
        if (e.target.files[0])
          process(e.target.files[0], e.target.files[0].name);
      };

      async function process(blob, filename) {
        statusEl.textContent =
          "Transcribing on-device... (first run downloads the model)";
        const fd = new FormData();
        fd.append("file", blob, filename);
        fd.append("model", document.getElementById("model").value);
        try {
          const res = await fetch("/api/process", { method: "POST", body: fd });
          if (!res.ok) throw new Error(await res.text());
          const data = await res.json();
          document.getElementById("outCard").style.display = "block";
          document.getElementById("transcript").textContent =
            data.transcript || "(nothing heard)";
          document.getElementById("summary").textContent = data.summary || "-";
          document.getElementById("keywords").innerHTML = (data.keywords || [])
            .map((k) => `<span class="pill">${k}</span>`)
            .join("");
          statusEl.textContent = "✅ Done — processed 100% locally.";
        } catch (err) {
          statusEl.textContent = "❌ Error: " + err.message;
        }
      }
    </script>
  </body>
</html>
